<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>風のバトロワシミュレーター</title>
    <style>
        body { font-family: "MS UI Gothic", sans-serif; background: #f0f0f0; font-size: 12px; margin: 0; padding: 10px; }
        .window { width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; }
        .col { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        label { font-weight: bold; background: #dcdcdc; padding: 2px 5px; border: 1px solid #7a7a7a; }
        textarea { font-family: "MS UI Gothic", monospace; font-size: 12px; resize: none; border: 1px solid #7a7a7a; padding: 5px; background: white; }
        input[type="text"] { border: 1px solid #7a7a7a; padding: 2px; }
        .panel { border: 1px solid #b0b0b0; padding: 8px; background: #e8e8e8; height: 100%; }
        
        #urlEditorWindow { background: #f0f0f0; border: 2px solid #7a7a7a; padding: 10px; flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
        .url-box { height: 80px !important; width: 100%; }
        .active-line-info { background: #333; color: #fff; padding: 3px 8px; font-weight: bold; margin-bottom: 5px; }

        button { padding: 8px 20px; cursor: pointer; background: #e1e1e1; border: 1px solid #7a7a7a; font-weight: bold; }
        button:hover { background: #d1d1d1; }
        #textBox2 { background: white; color: black; height: 450px; }
        .main-editor { height: 180px !important; }
        .current-target { border: 2px solid #0078d7 !important; }
    </style>
</head>
<body>

<div class="window">
    <div class="row">
        <div class="col" style="flex: 3;">
            <div class="row">
                <div class="col">
                    <label>名簿</label>
                    <textarea id="textBox1" class="main-editor" onkeyup="updateActiveLine(this)" onclick="updateActiveLine(this)">太郎,1
次郎,0
三郎,2
シロウ,1
五郎,3
六郎,1
七太郎,1</textarea>
                </div>
                <div class="col">
                    <label>死因</label>
                    <textarea id="textBox8" class="main-editor" onkeyup="updateActiveLine(this)" onclick="updateActiveLine(this)">に撲殺されました
に暗殺されました
に斬殺されました
に毒殺されました
に焼殺されました</textarea>
                </div>
                <div class="col">
                    <label>イベント</label>
                    <textarea id="textBox11" class="main-editor" onkeyup="updateActiveLine(this)" onclick="updateActiveLine(this)">が接触し情報を共有しました
は疑心暗鬼になり分裂してしまいました
は行動をともにし仲を深めました</textarea>
                </div>
            </div>
        </div>

        <div id="urlEditorWindow">
            <div class="active-line-info" id="activeInfo">選択中の行: なし</div>
            
            <div id="normalUrlArea">
                <label style="display:block; border:none; background:none;">通常時の画像URL (最大30)</label>
                <textarea id="urlNormal" class="url-box" placeholder="1行に1つURLを入力" oninput="saveUrls()"></textarea>
            </div>
            
            <div id="deathUrlArea">
                <label style="display:block; border:none; background:none;">死亡時の画像URL (キャラのみ)</label>
                <textarea id="urlDeath" class="url-box" placeholder="殺害された時のみ表示" oninput="saveUrls()"></textarea>
            </div>
            <div style="font-size: 10px; color: #666;">※上のリストの行を選択すると切り替わります</div>
        </div>
    </div>

    <div class="row">
        <div class="col" style="flex: 2;">
            <label>実行ログ</label>
            <textarea id="textBox2" readonly></textarea>
        </div>
        <div class="col">
            <div class="panel">
                <label style="border:none; background:none;">設定項目</label><br><br>
                <input type="checkbox" id="checkBox1" checked> 主催戦あり<br>
                <input type="checkbox" id="checkBox2" checked> ランダム主催者<br>
                <input type="checkbox" id="checkBox3" checked> 死因の適用<br>
                <input type="checkbox" id="checkBox4" checked> その他イベント<br>
                <input type="checkbox" id="checkBox5" checked> 好戦度の適用<br><br>
                主催者名: <input type="text" id="textBox4" value="疾風の春草"><br><br>
                <button onclick="runSimulation()">ロワ開始</button>
            </div>
        </div>
    </div>
</div>

<script>
let storage = {
    'textBox1': {},
    'textBox8': {},
    'textBox11': {}
};

let currentTargetId = '';
let currentLineNum = -1;

function updateActiveLine(el) {
    currentTargetId = el.id;
    const textBeforeCursor = el.value.substr(0, el.selectionStart);
    currentLineNum = textBeforeCursor.split('\n').length - 1;
    
    const categoryName = {"textBox1":"名簿", "textBox8":"死因", "textBox11":"イベント"}[el.id];
    document.getElementById('activeInfo').innerText = `選択: ${categoryName} [${currentLineNum + 1}行目]`;
    document.getElementById('deathUrlArea').style.visibility = (el.id === 'textBox1') ? 'visible' : 'hidden';

    if (!storage[currentTargetId][currentLineNum]) {
        storage[currentTargetId][currentLineNum] = { normal: [], death: [] };
    }
    document.getElementById('urlNormal').value = storage[currentTargetId][currentLineNum].normal.join('\n');
    document.getElementById('urlDeath').value = storage[currentTargetId][currentLineNum].death.join('\n');
}

function saveUrls() {
    if (currentTargetId === '' || currentLineNum === -1) return;
    const normalVal = document.getElementById('urlNormal').value.split('\n').filter(u => u.trim().startsWith('http')).slice(0, 30);
    const deathVal = document.getElementById('urlDeath').value.split('\n').filter(u => u.trim().startsWith('http')).slice(0, 30);
    storage[currentTargetId][currentLineNum] = { normal: normalVal, death: deathVal };
}

function getRandUrl(category, lineIdx, isDeath = false) {
    const data = storage[category][lineIdx];
    if (!data) return "";
    let pool = isDeath ? (data.death.length > 0 ? data.death : data.normal) : data.normal;
    if (!pool || pool.length === 0) return "";
    return pool[Math.floor(Math.random() * pool.length)];
}

function runSimulation() {
    const log = document.getElementById('textBox2');
    const meiboLines = document.getElementById('textBox1').value.split('\n').filter(l => l.trim() !== "");
    const satsugaiLines = document.getElementById('textBox8').value.split('\n').filter(l => l.trim() !== "");
    const eventLines = document.getElementById('textBox11').value.split('\n').filter(l => l.trim() !== "");
    
    log.value = "";
    if (meiboLines.length === 0) return;

    let num = meiboLines.length;
    let array = []; 
    let array4 = []; 
    let array6 = new Array(num).fill(0); 
    let array7 = Array.from({length: 6}, () => []); 

    let num7=0, num8=0, num9=0, num12=1, num13=0, num14=0;

    let orgName = document.getElementById('textBox4').value;
    const c1 = document.getElementById('checkBox1').checked; 
    const c2 = document.getElementById('checkBox3').checked; 
    const c4 = document.getElementById('checkBox4').checked; 
    const c5 = document.getElementById('checkBox5').checked; 
    const isRandOrg = document.getElementById('checkBox2').checked;

    meiboLines.forEach((line, i) => {
        let parts = line.split(',');
        let name = parts[0].trim();
        let aggro = parts[1] ? parseInt(parts[1]) : 0;
        array[i] = { name: name, aggro: aggro, originalIdx: i };
        if (aggro >= 0 && aggro <= 5) array7[aggro].push(i);
    });

    let indices = Array.from({length: num}, (_, i) => i);
    let tempIndices = [...indices];
    for (let i = 0; i < num; i++) array4.push(tempIndices.splice(Math.floor(Math.random() * tempIndices.length), 1)[0]);

    let organizerIdx = -1;
    if (isRandOrg) {
        organizerIdx = array4[0];
        orgName = array[organizerIdx].name;
        num13 = 1; num14 = 1;
    } else {
        organizerIdx = array.findIndex(p => p.name === orgName);
    }

    log.value += "ゲーム開始\n";

    function processDeaths(count) {
        for (let i = 0; i < count; i++) {
            if (num13 >= num - 1) break; 
            let vIdx = array4[num13];
            let survivors = array4.slice(num13 + 1);
            let kIdx = survivors[Math.floor(Math.random() * survivors.length)];
            
            let v = array[vIdx];
            let k = array[kIdx];
            let urlLine = "";

            if (!c2) {
                log.value += v.name + " が " + k.name + " に 殺されました\n";
                urlLine = (getRandUrl('textBox1', vIdx, true) + " " + getRandUrl('textBox1', kIdx)).trim();
            } else {
                let causeIdx = Math.floor(Math.random() * satsugaiLines.length);
                log.value += v.name + " は " + k.name + satsugaiLines[causeIdx] + "\n";
                urlLine = (getRandUrl('textBox1', vIdx, true) + " " + getRandUrl('textBox1', kIdx) + " " + getRandUrl('textBox8', causeIdx)).trim();
            }
            if (urlLine) log.value += urlLine + "\n";
            
            array6[kIdx]++;
            if (array6[num7] < array6[kIdx] && num7 != kIdx) { num9=num8; num8=num7; num7=kIdx; }
            else if (array6[num8] < array6[kIdx] && num8 != kIdx) { num9=num8; num8=kIdx; }
            else if (array6[num9] < array6[kIdx] && num9 != kIdx) { num9=kIdx; }

            if (c4 && Math.random() > 0.5) {
                let currentAlive = array4.slice(num13 + 1);
                if (currentAlive.length >= 2) {
                    let e1Idx = currentAlive[Math.floor(Math.random() * currentAlive.length)];
                    let e2Idx = currentAlive[Math.floor(Math.random() * currentAlive.length)];
                    let evIdx = Math.floor(Math.random() * eventLines.length);
                    if (e1Idx !== e2Idx) {
                        log.value += array[e1Idx].name + " と " + array[e2Idx].name + eventLines[evIdx] + "\n";
                        let evUrl = (getRandUrl('textBox1', e1Idx) + " " + getRandUrl('textBox1', e2Idx) + " " + getRandUrl('textBox11', evIdx)).trim();
                        if (evUrl) log.value += evUrl + "\n";
                    }
                }
            }
            num13++;
        }
    }

    let initialD = Math.max(1, Math.floor(Math.random() * (num / 4)));
    processDeaths(initialD);

    do {
        log.value += "\n第" + num12 + "放送\n";
        let num16 = 0;
        for (let i = num14; i < num13; i++) {
            if (array[array4[i]].name !== orgName) {
                log.value += array[array4[i]].name + "\n";
                num16++;
            }
        }
        if (num16 !== 0) log.value += "が退場しました\n";
        else log.value += "今回の死人はいませんでした\n";
        log.value += "\n";
        num14 = num13; num12++;
        let rem = num - num13;
        if (rem <= 1) break;
        let nextD = Math.floor(Math.random() * (rem / 2)) + 1;
        processDeaths(nextD);
    } while (num - num13 > 1 && Math.random() > 0.2);

    let survivorsAtEnd = array4.slice(num13);
    if (survivorsAtEnd.length === 1) {
        log.value += array[survivorsAtEnd[0]].name + "が生き残り優勝者に選ばれました\n";
    }
    log.value += "ゲームが終了しました\n\n";

    if (c1) {
        log.value += "主催戦が始まりました\n\n";
        let finalSurvivors = [...array4.slice(num13)];
        for (let pIdx of finalSurvivors) {
            if (array[pIdx].name === orgName) continue; 
            let p = array[pIdx];
            if (Math.random() < 0.33) {
                log.value += "主催者" + orgName + " が " + p.name + " に 殺されました\n";
                let urlLine = (getRandUrl('textBox1', organizerIdx, true) + " " + getRandUrl('textBox1', pIdx)).trim();
                if (urlLine) log.value += urlLine + "\n";
                break; 
            } else {
                log.value += p.name + "は主催者" + orgName + "に殺されました\n";
                let urlLine = (getRandUrl('textBox1', pIdx, true) + " " + getRandUrl('textBox1', organizerIdx)).trim();
                if (urlLine) log.value += urlLine + "\n";
                num13++; 
            }
        }
        if (num === num13) log.value += "参加者が全滅しました\n";
        log.value += "\n";
    }

    if (num - num13 > 0) {
        log.value += "生還者は\n";
        let num15 = 0;
        for (let i = num13; i < num; i++) {
            log.value += array[array4[i]].name + "\n";
            num15++;
        }
        log.value += "以上の" + num15 + "名でした\n\n";
    }

    if (array6[num7] > 0) log.value += "トップマーダーは" + array6[num7] + "人殺した" + array[num7].name + "でした\n";
    if (num8 != num7 && array6[num8] > 0) log.value += "次点は" + array6[num8] + "人殺した" + array[num8].name + "でした\n";
    if (num9 != num8 && num9 != num7 && array6[num9] > 0) log.value += "次点は" + array6[num9] + "人殺した" + array[num9].name + "でした\n";
}
</script>
</body>
</html>
